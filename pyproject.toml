[project]
name = "reporting-etl"
version = "1.0.0"
description = "ETL pipeline for reporting data: CSV + REST API -> pandas validation -> PostgreSQL, with a dashboard UI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "B905"]

